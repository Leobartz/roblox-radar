name: Radar - coletar dados e publicar site

on:
  schedule:
    - cron: '7 * * * *'      # toda hora, no minuto 7 (horário UTC)
  workflow_dispatch:         # botão "Run workflow" pra rodar na mão
  push:
    branches: [main]         # também roda quando você mudar algo no site/config

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Baixar dados das rodadas anteriores (branch "data")
        run: |
          rm -rf data
          git clone --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data \
            || { echo "primeira rodada, sem dados ainda"; mkdir -p data; }
          rm -rf data/.git

      - name: Coletar dados do Roblox
        run: node collector/collect.mjs

      - name: Salvar dados na branch "data" (sem acumular histórico do git)
        run: |
          cd data
          git init -b data
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "dados $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: Montar o site
        run: |
          rm -rf _site && mkdir -p _site
          cp -r site/. _site/
          cp -r data _site/data
          rm -rf _site/data/.git

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar site
        id: deploy
        uses: actions/deploy-pages@v4
