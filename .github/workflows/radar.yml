name: Radar - coletar dados

on:
  schedule:
    - cron: '7,22,37,52 * * * *'  # contingência gratuita a cada 15 min; Cloudflare dispara no minuto cheio
  workflow_dispatch:         # botão "Run workflow" pra rodar na mão
  push:
    branches: [main]         # também roda quando você mudar algo no site/config

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Baixar dados das rodadas anteriores (branch "data")
        run: |
          rm -rf data
          git clone --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data \
            || { echo "primeira rodada, sem dados ainda"; mkdir -p data; }
          rm -rf data/.git

      - name: Coletar dados do Roblox
        run: node collector/collect.mjs

      - name: Salvar dados na branch "data" (sem acumular histórico do git)
        run: |
          cd data
          git init -b data
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "dados $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
